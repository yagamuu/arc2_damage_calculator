name: CI

on:
  pull_request:
  push:
    branches: [master, migrate/vue3]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      # tsc --noEmit は TypeScript 3.8 が Vitest の型定義を構文解析できず失敗するため、
      # 型チェックは TypeScript 5 系へ上げる #55 で追加する
      - run: npm run test:unit
      # 公開物の docs/ は移行の完了時（#46 段階3）にだけ更新するため、git の管理対象外の
      # .ci-build/ にビルドし、E2E もそれに対して実行する
      - run: npm run build:temp
      - name: docs/ が変更されていないことを確認
        run: test -z "$(git status --porcelain -- docs)"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          E2E_SERVED_DIR: .ci-build
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
